name: Linux Uniform Release

on:
  workflow_call:
    inputs:
      app_name:
        required: true
        type: string
        description: "Application and repository name in lowercase kebab-case (e.g. net-watch-pro)"
      frontend_dir:
        required: false
        type: string
        default: "app"
        description: "Directory containing frontend package.json"
      package_manager:
        required: false
        type: string
        default: "npm"
        description: "npm or pnpm"
      build_cmd:
        required: false
        type: string
        default: ""
        description: "Custom build command (if omitted, runs standard cargo build --release --locked)"
      extra_binaries_cmd:
        required: false
        type: string
        default: ""
        description: "Command to build helper binaries or artifacts (e.g. atpd-helper, xtask bpf)"
      binary_path:
        required: false
        type: string
        default: ""
        description: "Path to built binary (defaults to target/release/<app_name>)"
      system_deps:
        required: false
        type: string
        default: ""
        description: "Extra apt build dependencies for the Debian/Ubuntu build"
      nfpm_config:
        required: false
        type: string
        default: "packaging/nfpm.yaml"
        description: "Path to nfpm.yaml"
      node_version:
        required: false
        type: string
        default: "22"
      rust_version:
        required: false
        type: string
        default: "stable"
      runs_on:
        required: false
        type: string
        default: "ubuntu-22.04"
        description: "Runner image for build-and-package / build-deb"
      check_version_flag:
        required: false
        type: boolean
        default: false
        description: "Whether to run <app_name> --version in container smoke tests"
      per_distro_build:
        required: false
        type: boolean
        default: false
        description: "Build native Rust binaries inside each target distro (deb, rpm, arch) for C-ABI/FFmpeg portability"
      rpm_container:
        required: false
        type: string
        default: "fedora:latest"
        description: "Container image for per-distro RPM build"
      arch_container:
        required: false
        type: string
        default: "archlinux:latest"
        description: "Container image for per-distro Arch build"
      rpm_build_deps:
        required: false
        type: string
        default: ""
        description: "Extra dnf build dependencies when per_distro_build is true"
      arch_build_deps:
        required: false
        type: string
        default: ""
        description: "Extra pacman build dependencies when per_distro_build is true"
      smoke_ubuntu22:
        required: false
        type: boolean
        default: true
        description: "Run container smoke test on ubuntu:22.04"
      smoke_ubuntu24:
        required: false
        type: boolean
        default: true
        description: "Run container smoke test on ubuntu:24.04"
      smoke_fedora:
        required: false
        type: boolean
        default: true
        description: "Run container smoke test on fedora:latest"
      smoke_arch:
        required: false
        type: boolean
        default: true
        description: "Run container smoke test on archlinux:latest"
    secrets:
      SIGNING_KEY:
        required: false
      SIGNING_KEY_ID:
        required: false
      SIGNING_PASSPHRASE:
        required: false

permissions:
  contents: write

jobs:
  validate-version:
    name: Validate Release Version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      is_prerelease: ${{ steps.version.outputs.is_prerelease }}
    steps:
      - uses: actions/checkout@v4
      - name: Parse tag and semver
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if [[ ! "$TAG" =~ ^v[0-9] ]]; then
            echo "❌ Error: Release tag must start with 'v' and semver (e.g. v1.0.0 or v0.1.0-alpha.1)" >&2
            exit 1
          fi
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          if [[ "$VERSION" =~ (-|\+) ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi
          echo "Validated tag: $TAG -> Version: $VERSION"

      - name: Verify manifest versions match release tag
        env:
          APP_NAME: ${{ inputs.app_name }}
          FRONTEND_DIR: ${{ inputs.frontend_dir }}
          EXPECTED: ${{ steps.version.outputs.version }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, re

          root = pathlib.Path(".")
          app_name = os.environ["APP_NAME"]
          frontend_dir = os.environ["FRONTEND_DIR"]
          expected = os.environ["EXPECTED"]
          checked = []

          pkg_json = root / frontend_dir / "package.json"
          if pkg_json.is_file():
              v = json.loads(pkg_json.read_text())["version"]
              assert v == expected, f"{pkg_json}: version {v!r} != tag {expected!r}"
              checked.append(str(pkg_json))

          for tc in root.rglob("tauri.conf.json"):
              rel = tc.relative_to(root)
              if any(p in {"node_modules", "target", "spikes"} for p in rel.parts):
                  continue
              v = json.loads(tc.read_text()).get("version")
              if v:
                  assert v == expected, f"{rel}: version {v!r} != tag {expected!r}"
                  checked.append(str(rel))

          root_cargo = root / "Cargo.toml"
          if root_cargo.is_file():
              m = re.search(r'^version\s*=\s*"([^"]+)"', root_cargo.read_text(), re.M)
              if m:
                  assert m.group(1) == expected, f"Cargo.toml: version {m.group(1)!r} != tag {expected!r}"
                  checked.append("Cargo.toml")

          for ct in root.rglob("Cargo.toml"):
              rel = ct.relative_to(root)
              if any(p in {"node_modules", "target", "spikes"} for p in rel.parts):
                  continue
              txt = ct.read_text()
              if f'name = "{app_name}"' in txt:
                  m = re.search(r'^version\s*=\s*"([^"]+)"', txt, re.M)
                  if m:
                      assert m.group(1) == expected, f"{rel}: version {m.group(1)!r} != tag {expected!r}"
                      checked.append(str(rel))

          assert checked, "No manifest files were matched for version verification"
          print(f"Manifest version parity verified ({expected}): {', '.join(checked)}")
          PY

  # ---------------------------------------------------------------------------
  # Mode A (default): single binary build packaged into deb, rpm, archlinux
  # ---------------------------------------------------------------------------
  build-and-package:
    name: Build & Package (deb, rpm, arch)
    needs: validate-version
    if: ${{ !inputs.per_distro_build }}
    runs-on: ${{ inputs.runs_on }}
    env:
      APP_NAME: ${{ inputs.app_name }}
      VERSION: ${{ needs.validate-version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev libwebkit2gtk-4.1-dev \
            libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev \
            desktop-file-utils ${{ inputs.system_deps }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}

      - name: Setup pnpm (if required)
        if: inputs.package_manager == 'pnpm'
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ inputs.rust_version }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install nfpm
        run: |
          NFPM_VERSION="2.41.3"
          curl -fsSL "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz" | sudo tar -xz -C /usr/local/bin nfpm
          nfpm --version

      - name: Build frontend
        run: |
          if [ -d "${{ inputs.frontend_dir }}" ]; then
            cd "${{ inputs.frontend_dir }}"
            if [ "${{ inputs.package_manager }}" = "pnpm" ]; then
              pnpm install --frozen-lockfile
              pnpm build
            else
              npm ci
              npm run build
            fi
          fi

      - name: Build extra binaries (if configured)
        if: inputs.extra_binaries_cmd != ''
        run: ${{ inputs.extra_binaries_cmd }}

      - name: Build release binaries (custom)
        if: inputs.build_cmd != ''
        run: ${{ inputs.build_cmd }}

      - name: Build release binaries (default)
        if: inputs.build_cmd == ''
        run: cargo build --release --locked

      - name: Assemble Packages with nfpm
        run: |
          rm -rf release-dist && mkdir -p release-dist
          BIN_PATH="${{ inputs.binary_path }}"
          if [ -z "$BIN_PATH" ]; then
            BIN_PATH="target/release/${{ inputs.app_name }}"
          fi

          if [ ! -f "$BIN_PATH" ]; then
            echo "❌ Error: Release binary not found at $BIN_PATH" >&2
            ls -la target/release/ || true
            exit 1
          fi

          DEB_FILE="release-dist/${APP_NAME}_${VERSION}_amd64.deb"
          RPM_FILE="release-dist/${APP_NAME}-${VERSION}-1.x86_64.rpm"
          ARCH_FILE="release-dist/${APP_NAME}-${VERSION}-1-x86_64.pkg.tar.zst"

          echo "Building Debian package: $DEB_FILE"
          nfpm pkg --config "${{ inputs.nfpm_config }}" --packager deb --target "$DEB_FILE"

          echo "Building RPM package: $RPM_FILE"
          nfpm pkg --config "${{ inputs.nfpm_config }}" --packager rpm --target "$RPM_FILE"

          echo "Building Arch package: $ARCH_FILE"
          nfpm pkg --config "${{ inputs.nfpm_config }}" --packager archlinux --target "$ARCH_FILE"

          ls -lh release-dist/

      - name: Generate Checksums
        working-directory: release-dist
        run: |
          sha256sum *.deb *.rpm *.pkg.tar.zst > SHA256SUMS
          cat SHA256SUMS

      - name: Sign Checksums (if GPG key provided)
        working-directory: release-dist
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_KEY_ID: ${{ secrets.SIGNING_KEY_ID }}
          SIGNING_PASSPHRASE: ${{ secrets.SIGNING_PASSPHRASE }}
        run: |
          if [ -z "$SIGNING_KEY" ]; then
            echo "No SIGNING_KEY provided; skipping GPG signing."
            exit 0
          fi
          echo "$SIGNING_KEY" | gpg --batch --import
          gpg --batch --yes --pinentry-mode loopback \
            --passphrase "$SIGNING_PASSPHRASE" \
            --local-user "$SIGNING_KEY_ID" \
            --detach-sign --armor --output SHA256SUMS.sig SHA256SUMS
          gpg --verify SHA256SUMS.sig SHA256SUMS

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-packages
          path: release-dist/
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Mode B (per_distro_build: true): native Rust builds per distro + nfpm
  # ---------------------------------------------------------------------------
  build-frontend:
    name: Build Frontend Assets
    needs: validate-version
    if: ${{ inputs.per_distro_build }}
    runs-on: ubuntu-24.04
    outputs:
      has_dist: ${{ steps.frontend.outputs.has_dist }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}

      - name: Setup pnpm (if required)
        if: inputs.package_manager == 'pnpm'
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Build frontend
        id: frontend
        run: |
          if [ -d "${{ inputs.frontend_dir }}" ] && [ -f "${{ inputs.frontend_dir }}/package.json" ]; then
            cd "${{ inputs.frontend_dir }}"
            if [ "${{ inputs.package_manager }}" = "pnpm" ]; then
              pnpm install --frozen-lockfile
              pnpm build
            else
              npm ci
              npm run build
            fi
            echo "has_dist=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_dist=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload frontend dist
        if: steps.frontend.outputs.has_dist == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: ${{ inputs.frontend_dir }}/dist
          if-no-files-found: error

  build-deb:
    name: Build & Package (deb)
    needs: [validate-version, build-frontend]
    if: ${{ inputs.per_distro_build }}
    runs-on: ${{ inputs.runs_on }}
    env:
      APP_NAME: ${{ inputs.app_name }}
      VERSION: ${{ needs.validate-version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Download frontend dist
        if: needs.build-frontend.outputs.has_dist == 'true'
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: ${{ inputs.frontend_dir }}/dist

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev libwebkit2gtk-4.1-dev \
            libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev \
            desktop-file-utils ${{ inputs.system_deps }}

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ inputs.rust_version }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: deb-${{ inputs.runs_on }}

      - name: Install nfpm
        run: |
          NFPM_VERSION="2.41.3"
          curl -fsSL "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz" | sudo tar -xz -C /usr/local/bin nfpm
          nfpm --version

      - name: Build extra binaries (if configured)
        if: inputs.extra_binaries_cmd != ''
        run: ${{ inputs.extra_binaries_cmd }}

      - name: Build release binaries (custom)
        if: inputs.build_cmd != ''
        run: ${{ inputs.build_cmd }}

      - name: Build release binaries (default)
        if: inputs.build_cmd == ''
        run: cargo build --release --locked

      - name: Package deb with nfpm
        run: |
          rm -rf release-dist && mkdir -p release-dist
          BIN_PATH="${{ inputs.binary_path }}"
          if [ -z "$BIN_PATH" ]; then
            BIN_PATH="target/release/${{ inputs.app_name }}"
          fi
          test -f "$BIN_PATH"
          DEB_FILE="release-dist/${APP_NAME}_${VERSION}_amd64.deb"
          nfpm pkg --config "${{ inputs.nfpm_config }}" --packager deb --target "$DEB_FILE"
          ls -lh release-dist/

      - name: Upload deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: pkg-deb
          path: release-dist/*.deb
          if-no-files-found: error

  build-rpm:
    name: Build & Package (rpm)
    needs: [validate-version, build-frontend]
    if: ${{ inputs.per_distro_build }}
    runs-on: ubuntu-latest
    container: ${{ inputs.rpm_container }}
    env:
      APP_NAME: ${{ inputs.app_name }}
      VERSION: ${{ needs.validate-version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Download frontend dist
        if: needs.build-frontend.outputs.has_dist == 'true'
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: ${{ inputs.frontend_dir }}/dist

      - name: Install Fedora system dependencies
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            gcc gcc-c++ make pkgconf-pkg-config openssl-devel \
            webkit2gtk4.1-devel gtk3-devel libayatana-appindicator-gtk3-devel \
            librsvg2-devel desktop-file-utils git curl tar gzip findutils ca-certificates \
            ${{ inputs.rpm_build_deps }}

      - name: Setup Rust toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain "${{ inputs.rust_version }}"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/rustc" --version

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: rpm-${{ inputs.rpm_container }}

      - name: Install nfpm
        run: |
          NFPM_VERSION="2.41.3"
          curl -fsSL "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz" | tar -xz -C /usr/local/bin nfpm
          nfpm --version

      - name: Build extra binaries (if configured)
        if: inputs.extra_binaries_cmd != ''
        run: ${{ inputs.extra_binaries_cmd }}

      - name: Build release binaries (custom)
        if: inputs.build_cmd != ''
        run: ${{ inputs.build_cmd }}

      - name: Build release binaries (default)
        if: inputs.build_cmd == ''
        run: cargo build --release --locked

      - name: Package rpm with nfpm
        run: |
          rm -rf release-dist && mkdir -p release-dist
          BIN_PATH="${{ inputs.binary_path }}"
          if [ -z "$BIN_PATH" ]; then
            BIN_PATH="target/release/${{ inputs.app_name }}"
          fi
          test -f "$BIN_PATH"
          RPM_FILE="release-dist/${APP_NAME}-${VERSION}-1.x86_64.rpm"
          nfpm pkg --config "${{ inputs.nfpm_config }}" --packager rpm --target "$RPM_FILE"
          ls -lh release-dist/

      - name: Upload rpm artifact
        uses: actions/upload-artifact@v4
        with:
          name: pkg-rpm
          path: release-dist/*.rpm
          if-no-files-found: error

  build-arch:
    name: Build & Package (arch)
    needs: [validate-version, build-frontend]
    if: ${{ inputs.per_distro_build }}
    runs-on: ubuntu-latest
    container: ${{ inputs.arch_container }}
    env:
      APP_NAME: ${{ inputs.app_name }}
      VERSION: ${{ needs.validate-version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Download frontend dist
        if: needs.build-frontend.outputs.has_dist == 'true'
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: ${{ inputs.frontend_dir }}/dist

      - name: Install Arch system dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            base-devel pkgconf openssl webkit2gtk-4.1 gtk3 \
            libayatana-appindicator librsvg desktop-file-utils \
            git curl tar gzip ca-certificates rustup ${{ inputs.arch_build_deps }}
          rustup default "${{ inputs.rust_version }}"
          rustc --version

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: arch-${{ inputs.arch_container }}

      - name: Install nfpm
        run: |
          NFPM_VERSION="2.41.3"
          curl -fsSL "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz" | tar -xz -C /usr/local/bin nfpm
          nfpm --version

      - name: Build extra binaries (if configured)
        if: inputs.extra_binaries_cmd != ''
        run: ${{ inputs.extra_binaries_cmd }}

      - name: Build release binaries (custom)
        if: inputs.build_cmd != ''
        run: ${{ inputs.build_cmd }}

      - name: Build release binaries (default)
        if: inputs.build_cmd == ''
        run: cargo build --release --locked

      - name: Package Arch pkg.tar.zst with nfpm
        run: |
          rm -rf release-dist && mkdir -p release-dist
          BIN_PATH="${{ inputs.binary_path }}"
          if [ -z "$BIN_PATH" ]; then
            BIN_PATH="target/release/${{ inputs.app_name }}"
          fi
          test -f "$BIN_PATH"
          ARCH_FILE="release-dist/${APP_NAME}-${VERSION}-1-x86_64.pkg.tar.zst"
          nfpm pkg --config "${{ inputs.nfpm_config }}" --packager archlinux --target "$ARCH_FILE"
          ls -lh release-dist/

      - name: Upload arch artifact
        uses: actions/upload-artifact@v4
        with:
          name: pkg-arch
          path: release-dist/*.pkg.tar.zst
          if-no-files-found: error

  package-bundle:
    name: Bundle Checksums & Signatures
    needs: [validate-version, build-deb, build-rpm, build-arch]
    if: ${{ inputs.per_distro_build }}
    runs-on: ubuntu-24.04
    steps:
      - name: Download per-distro packages
        uses: actions/download-artifact@v4
        with:
          pattern: pkg-*
          path: release-dist/
          merge-multiple: true

      - name: Generate Checksums
        working-directory: release-dist
        run: |
          ls -lh
          sha256sum *.deb *.rpm *.pkg.tar.zst > SHA256SUMS
          cat SHA256SUMS

      - name: Sign Checksums (if GPG key provided)
        working-directory: release-dist
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_KEY_ID: ${{ secrets.SIGNING_KEY_ID }}
          SIGNING_PASSPHRASE: ${{ secrets.SIGNING_PASSPHRASE }}
        run: |
          if [ -z "$SIGNING_KEY" ]; then
            echo "No SIGNING_KEY provided; skipping GPG signing."
            exit 0
          fi
          echo "$SIGNING_KEY" | gpg --batch --import
          gpg --batch --yes --pinentry-mode loopback \
            --passphrase "$SIGNING_PASSPHRASE" \
            --local-user "$SIGNING_KEY_ID" \
            --detach-sign --armor --output SHA256SUMS.sig SHA256SUMS
          gpg --verify SHA256SUMS.sig SHA256SUMS

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-packages
          path: release-dist/
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Clean-container verification (install + ldd link check + --version + remove)
  # ---------------------------------------------------------------------------
  smoke-test-deb-ubuntu22:
    name: Container Test (Ubuntu 22.04)
    needs: [validate-version, build-and-package, package-bundle]
    if: ${{ always() && inputs.smoke_ubuntu22 && needs.validate-version.result == 'success' && ((inputs.per_distro_build && needs.package-bundle.result == 'success') || (!inputs.per_distro_build && needs.build-and-package.result == 'success')) }}
    runs-on: ubuntu-latest
    container: ubuntu:22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-packages
          path: release-dist/
      - name: Install and verify .deb
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          apt-get install -y -qq desktop-file-utils
          DEB_FILE=$(find "$PWD/release-dist" -name "*.deb" | head -1)
          apt-get install -y "$DEB_FILE"
          test -x "/usr/bin/${{ inputs.app_name }}"
          for bin in $(dpkg -L "${{ inputs.app_name }}" | grep '^/usr/bin/' || true); do
            [ -f "$bin" ] && [ -x "$bin" ] || continue
            if [ "$(head -c4 "$bin" | od -An -tx1 | tr -d ' \n')" = "7f454c46" ]; then
              echo "Checking shared libraries for $bin..."
              LDD_OUT=$(ldd "$bin")
              if echo "$LDD_OUT" | grep -q "not found"; then
                echo "$LDD_OUT" >&2
                exit 1
              fi
            fi
          done
          if [ "${{ inputs.check_version_flag }}" = "true" ]; then
            "/usr/bin/${{ inputs.app_name }}" --version | grep -F "${{ needs.validate-version.outputs.version }}"
          fi
          if [ -f "/usr/share/applications/${{ inputs.app_name }}.desktop" ]; then
            desktop-file-validate "/usr/share/applications/${{ inputs.app_name }}.desktop"
          fi
          apt-get remove -y "${{ inputs.app_name }}"
          ! test -e "/usr/bin/${{ inputs.app_name }}"

  smoke-test-deb-ubuntu24:
    name: Container Test (Ubuntu 24.04)
    needs: [validate-version, build-and-package, package-bundle]
    if: ${{ always() && inputs.smoke_ubuntu24 && needs.validate-version.result == 'success' && ((inputs.per_distro_build && needs.package-bundle.result == 'success') || (!inputs.per_distro_build && needs.build-and-package.result == 'success')) }}
    runs-on: ubuntu-latest
    container: ubuntu:24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-packages
          path: release-dist/
      - name: Install and verify .deb
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          apt-get install -y -qq desktop-file-utils
          DEB_FILE=$(find "$PWD/release-dist" -name "*.deb" | head -1)
          apt-get install -y "$DEB_FILE"
          test -x "/usr/bin/${{ inputs.app_name }}"
          for bin in $(dpkg -L "${{ inputs.app_name }}" | grep '^/usr/bin/' || true); do
            [ -f "$bin" ] && [ -x "$bin" ] || continue
            if [ "$(head -c4 "$bin" | od -An -tx1 | tr -d ' \n')" = "7f454c46" ]; then
              echo "Checking shared libraries for $bin..."
              LDD_OUT=$(ldd "$bin")
              if echo "$LDD_OUT" | grep -q "not found"; then
                echo "$LDD_OUT" >&2
                exit 1
              fi
            fi
          done
          if [ "${{ inputs.check_version_flag }}" = "true" ]; then
            "/usr/bin/${{ inputs.app_name }}" --version | grep -F "${{ needs.validate-version.outputs.version }}"
          fi
          if [ -f "/usr/share/applications/${{ inputs.app_name }}.desktop" ]; then
            desktop-file-validate "/usr/share/applications/${{ inputs.app_name }}.desktop"
          fi
          apt-get remove -y "${{ inputs.app_name }}"
          ! test -e "/usr/bin/${{ inputs.app_name }}"

  smoke-test-rpm-fedora:
    name: Container Test (Fedora Latest)
    needs: [validate-version, build-and-package, package-bundle]
    if: ${{ always() && inputs.smoke_fedora && needs.validate-version.result == 'success' && ((inputs.per_distro_build && needs.package-bundle.result == 'success') || (!inputs.per_distro_build && needs.build-and-package.result == 'success')) }}
    runs-on: ubuntu-latest
    container: ${{ inputs.rpm_container }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-packages
          path: release-dist/
      - name: Install and verify .rpm
        run: |
          dnf install -y desktop-file-utils
          RPM_FILE=$(find "$PWD/release-dist" -name "*.rpm" | head -1)
          dnf install -y "$RPM_FILE"
          test -x "/usr/bin/${{ inputs.app_name }}"
          for bin in $(rpm -ql "${{ inputs.app_name }}" | grep '^/usr/bin/' || true); do
            [ -f "$bin" ] && [ -x "$bin" ] || continue
            if [ "$(head -c4 "$bin" | od -An -tx1 | tr -d ' \n')" = "7f454c46" ]; then
              echo "Checking shared libraries for $bin..."
              LDD_OUT=$(ldd "$bin")
              if echo "$LDD_OUT" | grep -q "not found"; then
                echo "$LDD_OUT" >&2
                exit 1
              fi
            fi
          done
          if [ "${{ inputs.check_version_flag }}" = "true" ]; then
            "/usr/bin/${{ inputs.app_name }}" --version | grep -F "${{ needs.validate-version.outputs.version }}"
          fi
          if [ -f "/usr/share/applications/${{ inputs.app_name }}.desktop" ]; then
            desktop-file-validate "/usr/share/applications/${{ inputs.app_name }}.desktop"
          fi
          dnf remove -y "${{ inputs.app_name }}"
          ! test -e "/usr/bin/${{ inputs.app_name }}"

  smoke-test-arch:
    name: Container Test (Arch Linux Latest)
    needs: [validate-version, build-and-package, package-bundle]
    if: ${{ always() && inputs.smoke_arch && needs.validate-version.result == 'success' && ((inputs.per_distro_build && needs.package-bundle.result == 'success') || (!inputs.per_distro_build && needs.build-and-package.result == 'success')) }}
    runs-on: ubuntu-latest
    container: ${{ inputs.arch_container }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-packages
          path: release-dist/
      - name: Install and verify .pkg.tar.zst
        run: |
          pacman -Sy --noconfirm desktop-file-utils
          ARCH_FILE=$(find "$PWD/release-dist" -name "*.pkg.tar.zst" | head -1)
          pacman -U --noconfirm "$ARCH_FILE"
          test -x "/usr/bin/${{ inputs.app_name }}"
          for bin in $(pacman -Qlq "${{ inputs.app_name }}" | grep '^/usr/bin/' || true); do
            [ -f "$bin" ] && [ -x "$bin" ] || continue
            if [ "$(head -c4 "$bin" | od -An -tx1 | tr -d ' \n')" = "7f454c46" ]; then
              echo "Checking shared libraries for $bin..."
              LDD_OUT=$(ldd "$bin")
              if echo "$LDD_OUT" | grep -q "not found"; then
                echo "$LDD_OUT" >&2
                exit 1
              fi
            fi
          done
          if [ "${{ inputs.check_version_flag }}" = "true" ]; then
            "/usr/bin/${{ inputs.app_name }}" --version | grep -F "${{ needs.validate-version.outputs.version }}"
          fi
          if [ -f "/usr/share/applications/${{ inputs.app_name }}.desktop" ]; then
            desktop-file-validate "/usr/share/applications/${{ inputs.app_name }}.desktop"
          fi
          pacman -R --noconfirm "${{ inputs.app_name }}"
          ! test -e "/usr/bin/${{ inputs.app_name }}"

  publish-release:
    name: Publish Official GitHub Release
    needs:
      - validate-version
      - build-and-package
      - package-bundle
      - smoke-test-deb-ubuntu22
      - smoke-test-deb-ubuntu24
      - smoke-test-rpm-fedora
      - smoke-test-arch
    if: >-
      ${{
        always() &&
        needs.validate-version.result == 'success' &&
        ((inputs.per_distro_build && needs.package-bundle.result == 'success') || (!inputs.per_distro_build && needs.build-and-package.result == 'success')) &&
        ((inputs.smoke_ubuntu22 && needs.smoke-test-deb-ubuntu22.result == 'success') || (!inputs.smoke_ubuntu22 && needs.smoke-test-deb-ubuntu22.result == 'skipped')) &&
        ((inputs.smoke_ubuntu24 && needs.smoke-test-deb-ubuntu24.result == 'success') || (!inputs.smoke_ubuntu24 && needs.smoke-test-deb-ubuntu24.result == 'skipped')) &&
        ((inputs.smoke_fedora && needs.smoke-test-rpm-fedora.result == 'success') || (!inputs.smoke_fedora && needs.smoke-test-rpm-fedora.result == 'skipped')) &&
        ((inputs.smoke_arch && needs.smoke-test-arch.result == 'success') || (!inputs.smoke_arch && needs.smoke-test-arch.result == 'skipped'))
      }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-packages
          path: release-dist/
      - name: Generate release notes
        env:
          APP_NAME: ${{ inputs.app_name }}
          VERSION: ${{ needs.validate-version.outputs.version }}
        run: |
          cat <<EOF > release-notes.md
          ## Installation

          Download the package matching your distribution from the assets below:

          ### Ubuntu / Debian / Pop!_OS / Linux Mint
          \`\`\`bash
          sudo apt install ./${APP_NAME}_${VERSION}_amd64.deb
          \`\`\`

          ### Fedora / RHEL / openSUSE
          \`\`\`bash
          sudo dnf install ./${APP_NAME}-${VERSION}-1.x86_64.rpm
          \`\`\`

          ### Arch Linux / Manjaro / EndeavourOS
          \`\`\`bash
          sudo pacman -U ./${APP_NAME}-${VERSION}-1-x86_64.pkg.tar.zst
          \`\`\`

          ### Verify Checksums
          \`\`\`bash
          sha256sum -c SHA256SUMS
          \`\`\`

          ---
          *Notice: AppImage, Flatpak, and AUR builds are deprecated. Releases now exclusively ship official \`.deb\`, \`.rpm\`, and \`.pkg.tar.zst\` native packages.*
          EOF

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-dist/*.deb
            release-dist/*.rpm
            release-dist/*.pkg.tar.zst
            release-dist/SHA256SUMS
            release-dist/SHA256SUMS.sig
          fail_on_unmatched_files: false
          draft: false
          prerelease: ${{ needs.validate-version.outputs.is_prerelease == 'true' }}
          body_path: release-notes.md
          generate_release_notes: true
